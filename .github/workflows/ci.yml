name: CI

on:
  push:
    branches: [main, hardening-production]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: npm install --global npm@10.9.9
      - name: Generate lockfile when bootstrapping
        if: hashFiles('package-lock.json') == ''
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Preserve dependency lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: WanGP bridge tests
        run: python3 tests/wangp_bridge_test.py
      - name: Core smoke
        run: npm run test:smoke
      - name: Build
        run: npm run build
      - name: Package Linux directory
        run: npx electron-builder --dir --linux --x64

  package-windows:
    name: Package Windows
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: npm install --global npm@10.9.9
      - name: Install dependencies
        run: npm ci
      - name: Parse bootstrap scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw scripts/setup-windows.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw scripts/run-windows.ps1)) | Out-Null
      - name: Build renderer/main/preload
        run: npm run build
      - name: Build NSIS installer
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cineforge-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
